[package]
name    = "mjolnir-tools"
version.workspace = true
edition.workspace = true

[dependencies]
mjolnir-core        = { path = "../core" }
mjolnir-permissions = { path = "../permissions" }
mjolnir-config      = { path = "../config" }
tokio                = { workspace = true }
async-trait          = { workspace = true }
serde                = { workspace = true }
serde_json           = { workspace = true }
thiserror            = { workspace = true }
libc                 = "0.2"
rmcp                 = { version = "3.1.4", default-features = false, features = ["client", "transport-child-process"] }

[dev-dependencies]
tempfile     = "3"
mjolnir-core = { path = "../core", features = ["test-util"] }
