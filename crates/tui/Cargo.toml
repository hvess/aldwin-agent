[package]
name    = "aldwin-tui"
version.workspace = true
edition.workspace = true

[features]
# Exposes the seams `tests/render_snapshot.rs` and `examples/preview.rs`
# seed an `App` through. Dev-only; enabled for this crate's own tests and
# examples by the dev-dependency below. Mirrors aldwin-core's `test-util`.
test-util = []

[dependencies]
aldwin-core        = { path = "../core" }
tokio                = { workspace = true }
serde_json           = { workspace = true }
ratatui              = { version = "0.30", default-features = false, features = ["crossterm"] }
unicode-width        = { workspace = true }

[dev-dependencies]
aldwin-tui = { path = ".", features = ["test-util"] }
