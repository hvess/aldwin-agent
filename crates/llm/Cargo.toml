[package]
name    = "aldwin-llm"
version.workspace = true
edition.workspace = true

[features]
# Exposes `test_server` to other crates. Dev-only; see the module's doc comment.
test-server = []

[dependencies]
aldwin-core        = { path = "../core" }
aldwin-config      = { path = "../config" }
tokio              = { workspace = true }
futures            = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
async-stream       = { workspace = true }
reqwest            = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
eventsource-stream = "0.2"
rand               = "0.8"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
