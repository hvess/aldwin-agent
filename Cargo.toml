[workspace]
members = ["crates/core", "crates/config", "crates/tools", "crates/llm", "crates/tui", "crates/cli", "crates/review"]
resolver = "2"

[workspace.package]
edition = "2021"
version  = "0.3.0"

[workspace.dependencies]
tokio         = { version = "1", features = ["full"] }
futures       = "0.3"
async-trait   = "0.1"
async-stream  = "0.3"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
thiserror     = "2"
tempfile      = "3"
clap          = { version = "4", features = ["derive"] }
libc          = "0.2"
unicode-width = "0.2"
# Only aldwin-llm's manifest still names it, and nothing in that crate calls
# it; this entry goes when that line does.
tracing       = "0.1"
