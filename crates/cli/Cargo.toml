[package]
name    = "mjolnir-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "mjolnir"
path = "src/main.rs"

[dependencies]
mjolnir-core        = { path = "../core" }
mjolnir-config      = { path = "../config" }
mjolnir-permissions = { path = "../permissions" }
mjolnir-tools       = { path = "../tools" }
mjolnir-llm         = { path = "../llm" }
mjolnir-tui         = { path = "../tui" }
tokio                = { workspace = true }
futures              = { workspace = true }
thiserror            = { workspace = true }
tracing              = { workspace = true }
serde_json           = { workspace = true }
clap                 = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
