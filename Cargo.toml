[workspace]
members = ["crates/core", "crates/config", "crates/login", "crates/tools", "crates/llm", "crates/tui", "crates/cli", "crates/review"]
resolver = "2"

[workspace.package]
edition    = "2021"
version    = "0.8.0"
license    = "MIT"
repository = "https://github.com/hvess/aldwin-agent"

[workspace.dependencies]
tokio         = { version = "1", features = ["full"] }
futures       = "0.3"
async-trait   = "0.1"
async-stream  = "0.3"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
thiserror     = "2"
tempfile      = "3"
clap          = { version = "4", features = ["derive"] }
libc          = "0.2"
unicode-width = "0.2"
assert_cmd    = "2"

# The `rust` skill's checkable rules, enforced by stage 2 (`-D warnings`):
# "Use `///` for public API documentation", "Document panics and errors",
# and "Derive common traits: `Debug`, …".
[workspace.lints.rust]
missing_docs                  = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# The big-o and data-structures skills' checkable rules (aldwin-review.md Decision 14).
linkedlist = "warn"
stable_sort_primitive = "warn"
large_stack_arrays = "warn"
inefficient_to_string = "warn"
