[package]
name    = "aldwin-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "aldwin"
path = "src/main.rs"

[dependencies]
aldwin-core   = { path = "../core" }
aldwin-config = { path = "../config" }
aldwin-tools  = { path = "../tools" }
aldwin-llm    = { path = "../llm" }
aldwin-tui    = { path = "../tui" }
tokio         = { workspace = true }
futures       = { workspace = true }
thiserror     = { workspace = true }
clap          = { workspace = true }
async-stream  = { workspace = true }
# Already in the tree via rmcp — this adds a name, not a build. `Local`
# because a transcript's timestamp is read by the developer who made it,
# and UTC in a picker row is a small daily subtraction problem.
chrono        = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile   = { workspace = true }
assert_cmd = { workspace = true }
