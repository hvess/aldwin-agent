[workspace]
members = ["crates/core", "crates/config", "crates/permissions", "crates/tools", "crates/llm", "crates/tui", "crates/cli"]
resolver = "2"

[workspace.package]
edition = "2021"
version  = "0.1.18"

[workspace.dependencies]
tokio       = { version = "1", features = ["full"] }
tokio-util  = { version = "0.7", features = ["rt"] }
futures     = "0.3"
async-trait = "0.1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
tracing     = "0.1"
