name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: x86_64-unknown-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-latest
            name: apple_intel
          - target: aarch64-apple-darwin
            os: macos-latest
            name: apple_silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The binary reports Cargo.toml's version (`mjolnir --version`, the
      # TUI's top bar). Releases used to be tag-only, so the manifest sat at
      # 0.1.0 through eleven tagged releases and every build claimed to be
      # 0.1.0. Failing here is what keeps the two from drifting again: bump
      # the version, commit, then tag the same number.
      - name: Tag must match the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          manifest="$(grep -m1 -E '^version[[:space:]]*=' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest"
            exit 1
          fi
          echo "version $manifest matches tag $GITHUB_REF_NAME"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p mjolnir-cli

      - name: Package
        run: |
          out="mjolnir-${{ github.ref_name }}-${{ matrix.name }}.tar.gz"
          tar czf "$out" -C target/${{ matrix.target }}/release mjolnir
          mkdir -p dist
          mv "$out" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: mjolnir-${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
