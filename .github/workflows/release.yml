name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p amundsen-cli

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          out="amundsen-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar czf "$out" -C target/${{ matrix.target }}/release amundsen
          mkdir -p dist
          mv "$out" dist/

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          out="amundsen-${{ github.ref_name }}-${{ matrix.target }}.zip"
          (cd target/${{ matrix.target }}/release && 7z a "$OLDPWD/$out" amundsen.exe)
          mkdir -p dist
          mv "$out" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: amundsen-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
