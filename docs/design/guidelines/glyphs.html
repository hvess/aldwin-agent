<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head><body class="" style="padding:20px;font:var(--text-cell);color:var(--canvas-ink)"><div style="background:var(--win);color:var(--label2);padding:14px 3ch;border-radius:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px 2ch;white-space:pre"><div><span style="font-family:var(--font-ui);color:var(--accent);display:inline-block;width:3ch">›</span>prompt, current</div><div><span style="font-family:var(--font-ui);color:var(--accent);display:inline-block;width:3ch">✓</span>done, read</div><div><span style="font-family:var(--font-ui);color:var(--amber);display:inline-block;width:3ch">●</span>running</div><div><span style="font-family:var(--font-ui);color:var(--label3);display:inline-block;width:3ch">○</span>pending</div><div><span style="font-family:var(--font-ui);color:var(--accent);display:inline-block;width:3ch">▎</span>selected edge</div><div><span style="font-family:var(--font-ui);color:var(--accent);display:inline-block;width:3ch">◆</span>comment</div><div><span style="font-family:var(--font-ui);color:var(--label3);display:inline-block;width:3ch">⋯</span>folded lines</div><div><span style="font-family:var(--font-ui);color:var(--fill);display:inline-block;width:3ch">━</span>context segment</div><div><span style="font-family:var(--font-ui);color:var(--accent);display:inline-block;width:3ch">↩</span>send, add</div><div><span style="font-family:var(--font-ui);color:var(--accent);display:inline-block;width:3ch">⌃↩</span>approve</div><div><span style="font-family:var(--font-ui);color:var(--label2);display:inline-block;width:3ch">⎋</span>stop, close</div><div><span style="font-family:var(--font-ui);color:var(--label2);display:inline-block;width:3ch">↺</span>undo</div><div><span style="font-family:var(--font-ui);color:var(--accent);display:inline-block;width:3ch">/</span>commands</div><div><span style="font-family:var(--font-ui);color:var(--label2);display:inline-block;width:3ch">?</span>keys</div></div></body></html>
