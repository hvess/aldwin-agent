[package]
name    = "aldwin-review"
version.workspace = true
edition.workspace = true

# Dev-only harness. Nothing in the shipped binary may depend on this crate;
# `release.yml` builds `-p aldwin-cli`, so it is never in a release build.
[[bin]]
name = "aldwin-review"
path = "src/main.rs"

[dependencies]
# The product's own config writer, so a seeded global config is created by the
# code under test rather than by a copy of its templates that would drift.
aldwin-config = { path = "../config" }
# `LogRecord`, so a seeded transcript is written through the product's own
# history writer rather than by a copy of the JSONL format that would drift.
aldwin-core   = { path = "../core" }
# The product's own canned-response server, behind its dev-only feature, so a
# scene is driven by a provider that answers identically every run.
aldwin-llm    = { path = "../llm", features = ["test-server"] }
tokio          = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
clap        = { version = "4", features = ["derive"] }
libc        = "0.2"
flate2      = "1"        # only to read a PNG back and check the parser against it
unicode-width = "0.2"    # same crate the TUI measures with, so a wide glyph
                         # occupies the same number of cells in both

[dev-dependencies]
# Throwaway directories: a git repository for the gate's tests, run
# directories for the binary's.
tempfile = { workspace = true }
# The commit guard's tests run the hook script as a command.
assert_cmd = { workspace = true }

[lints]
workspace = true
