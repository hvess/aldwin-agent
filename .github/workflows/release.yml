name: Release

# Every step of substance lives in `scripts/release.sh`. This file chooses
# machines and moves files between them; it makes no decisions about how a
# binary is built or packaged.
#
# That split is the point. The previous version carried the recipe in `run:`
# blocks, which meant it could only ever be executed by GitHub — not run
# before pushing, not tested, and not reproducible by anyone checking that a
# published binary matches the source. Two bugs of exactly that kind shipped
# in it: a missing checkout, and a guard whose `[ cond ] && action` exited
# the step under `bash -e`.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Scoped per job. The build matrix only reads the tree; `contents: write`
# belongs to the one job that creates a release.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Apple Silicon only — Intel was dropped. macOS builds must happen
          # on macOS: cross-compiling Darwin needs Apple's SDK, and its
          # licence restricts that to Apple hardware.
          #
          # Pinned to a numbered image rather than `macos-latest`, which
          # moves under you and would change artifact hashes without a commit
          # to explain why. Bumping it is a deliberate change.
          - target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/release.sh check "${{ github.ref_name }}"

      # No toolchain action: `rust-toolchain.toml` pins the compiler and
      # rustup — present on every GitHub runner — honours it without being
      # told. The pin travels with the source, so a third party reproducing a
      # tag gets the same compiler without reading this file.
      - name: Build
        run: scripts/release.sh build "${{ matrix.target }}"

      # The whole `dist/bin` tree, so each artifact carries its own
      # `<target>/mjolnir` path and they merge without colliding downstream.
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/bin

  # Packaging, checksums and signing happen **once, on Linux**, never per
  # build machine.
  #
  # macOS ships bsdtar, which rejects the `--sort` / `--owner` / `--mtime`
  # flags that make an archive deterministic. Packaging on both runners would
  # mean two recipes with different flags — precisely the deviance this
  # rewrite exists to remove. So the Mac produces a binary and nothing else.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The tree is needed for the script, and for `cosign.pub`: the verify
      # step checks the signature against the *committed* public key, which
      # is the same file a recipient is told to use.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist/bin
          pattern: bin-*
          merge-multiple: true

      # Fails here, with something actionable, rather than inside cosign with
      # a message about a malformed key. A release that silently skipped
      # signing would be worse than one that did not build: the channel would
      # look signed and not be.
      - name: The signing key must be configured
        env:
          KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        # Plain `if` blocks, not `[ cond ] && action`: a `run:` step is
        # `bash -e`, where a standalone `&&` list whose left side is false
        # exits the step — so the happy path would have failed and the
        # unhappy one would not have reported anything.
        run: |
          missing=""
          if [ -z "$KEY" ]; then
            missing="the COSIGN_PRIVATE_KEY secret"
          fi
          if [ ! -f cosign.pub ]; then
            missing="${missing:+$missing and }the committed cosign.pub"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Release signing is not set up — missing $missing. Run \`cosign generate-key-pair\` in a temporary directory, add the private half as COSIGN_PRIVATE_KEY and its passphrase as COSIGN_PASSWORD, and commit cosign.pub. See README's \"Signing a release\"."
            exit 1
          fi

      - name: Package
        run: scripts/release.sh package

      - uses: sigstore/cosign-installer@v4

      # One signature over the checksum file rather than one per artifact: a
      # recipient runs two commands whatever the target matrix grows to, and
      # there is exactly one thing whose signature can be wrong.
      #
      # `--tlog-upload=false` keeps it out of Sigstore's public transparency
      # log, which would otherwise publish this private repository's name,
      # its workflow path and the timing of every release to a permanent
      # public record.
      - name: Sign the checksums
        working-directory: dist
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD:    ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign-blob \
            --key env://COSIGN_PRIVATE_KEY \
            --output-signature SHA256SUMS.sig \
            --tlog-upload=false \
            --yes \
            SHA256SUMS

      # Verified with the *public* key from the repository, using the same
      # command the README gives a recipient. Signing and then not checking
      # leaves the first real verification to someone who cannot tell a
      # broken pipeline from a tampered download.
      - name: Verify the signature the way a recipient does
        run: |
          cosign verify-blob \
            --key cosign.pub \
            --signature dist/SHA256SUMS.sig \
            --insecure-ignore-tlog=true \
            dist/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
          generate_release_notes: true
          append_body: true
          body: |
            ---

            ### Verifying this release

            Every artifact is covered by `SHA256SUMS`, and `SHA256SUMS` is
            signed. `cosign.pub` lives in the repository — take it from
            there, not from this page, so the key and the signature do not
            come from the same place.

            ```sh
            cosign verify-blob \
              --key cosign.pub \
              --signature SHA256SUMS.sig \
              --insecure-ignore-tlog=true \
              SHA256SUMS

            sha256sum -c SHA256SUMS
            ```

            `--insecure-ignore-tlog` is expected: the signature is
            deliberately not published to Sigstore's public transparency log,
            which would make this private repository's name and release
            cadence public. The flag disables a check that does not apply.

            ### Reproducing it

            The build is deterministic — the compiler is pinned in
            `rust-toolchain.toml`, dependencies by `Cargo.lock`, source paths
            are remapped out of the binary, and the archive carries no
            timestamps. Rebuilding this tag gives byte-identical archives:

            ```sh
            git checkout ${{ github.ref_name }}
            scripts/release.sh build x86_64-unknown-linux-gnu
            scripts/release.sh package ${{ github.ref_name }}
            sha256sum -c SHA256SUMS
            ```

            The macOS archive reproduces the same way, on a Mac — Apple's SDK
            licence is why that one cannot be checked from Linux.
